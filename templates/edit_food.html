{% extends "base.html" %}
{% block title %}Edit Record – FoodWise{% endblock %}
{% block content %}

<div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
    <a href="{{ url_for('view_records') }}" class="btn btn-secondary">← Back to Records</a>
    <h1 style="margin:0;">Edit Food Record</h1>
</div>

<div class="card" style="max-width:580px;">


    <form method="POST" id="editForm">
        <div class="form-group">
            <label>Food Name</label>
            <input type="text" name="food_name" value="{{ record.food_name }}" required>
        </div>
        <div style="display:grid; grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
                <label>Prepared Qty (kg)</label>
                <input type="number" name="prepared_qty" id="prepared" value="{{ record.prepared_qty }}" step="0.1" min="0.1" required oninput="checkWaste()">
            </div>
            <div class="form-group">
                <label>Wasted Qty (kg)</label>
                <input type="number" name="wasted_qty" id="wasted" value="{{ record.wasted_qty }}" step="0.1" min="0" required oninput="checkWaste()">
            </div>
        </div>
        <span id="waste_err" style="color:#c0392b; font-size:.8rem; display:none; margin-top:-0.8rem; display:block; margin-bottom:.6rem;"></span>

        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ today }}" min="{{ today }}" max="{{ today }}" required>
            <span style="font-size:.8rem; color:#888;">Only today's date is allowed.</span>
        </div>
        <div class="form-group">
            <label>Notes (optional)</label>
            <textarea name="notes">{{ record.notes or '' }}</textarea>
        </div>
        <div style="display:flex; gap:1rem;">
            <button type="submit" class="btn btn-primary">✅ Update Record</button>
            <a href="{{ url_for('view_records') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
function checkWaste() {
    const p = parseFloat(document.getElementById('prepared').value) || 0;
    const w = parseFloat(document.getElementById('wasted').value) || 0;
    const err = document.getElementById('waste_err');
    if (p > 0 && w > p) {
        err.textContent = '⚠️ Wasted quantity cannot exceed prepared quantity.';
        err.style.display = 'block';
    } else {
        err.style.display = 'none';
    }
}
checkWaste();
</script>
{% endblock %}
