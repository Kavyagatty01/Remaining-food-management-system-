{% extends "base.html" %}
{% block title %}Donate Food – FoodWise{% endblock %}
{% block content %}

<div style="display:flex; align-items:center; gap:1rem; margin-bottom:1.5rem;">
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">← Back</a>
    <h1 style="margin:0;">Record a Donation</h1>
</div>

<div class="card" style="max-width:580px;">



    <form method="POST">
        <div class="form-group">
            <label>Food Name </label>
            <input type="text" name="food_name" placeholder="e.g. Rice, Bread, Vegetables" required>
        </div>
        <div class="form-group">
            <label>Donated Quantity (kg)</label>
            <input type="number" name="donated_qty" placeholder="0.0" step="0.1" min="0.1" required>
        </div>
        <div class="form-group">
            <label>Recipient / Organisation</label>
            <input type="text" name="recipient" placeholder="e.g. City Shelter, Hope NGO" required>
        </div>
        <div class="form-group">
            <label>Date</label>
            <input type="date" name="date" value="{{ today }}" min="{{ today }}" max="{{ today }}" required>
            <span style="font-size:.8rem; color:#888;">Only today's date is allowed.</span>
        </div>
        <div style="display:flex; gap:1rem;">
            <button type="submit" class="btn btn-primary">🤝 Record Donation</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

{% endblock %}
