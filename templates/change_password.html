{% extends "base.html" %}
{% block title %}Change Password – FoodWise{% endblock %}
{% block content %}

<div style="display:flex;align-items:center;gap:1rem;margin-bottom:1.4rem;">
    <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">← Back</a>
    <h1 style="margin:0;">🔑 Change Password</h1>
</div>

<div class="card" style="max-width:420px;">
    <div style="background:#e8f4fd;border:1.5px solid #a9d4f0;border-radius:10px;padding:.9rem 1.1rem;margin-bottom:1.4rem;font-size:.85rem;color:#1a3a5c;">
        Changing password for: <strong>{{ session.user }}</strong>
    </div>

    <form method="POST" id="pwForm">
        <div class="form-group">
            <label>Current Password</label>
            <input type="password" name="current_password" required autocomplete="current-password">
        </div>
        <div class="form-group">
            <label>New Password <span style="color:#888;font-weight:400;">(min 4 characters)</span></label>
            <input type="password" name="new_password" id="new_pw" required autocomplete="new-password" oninput="checkMatch()">
        </div>
        <div class="form-group">
            <label>Confirm New Password</label>
            <input type="password" name="confirm_password" id="confirm_pw" required autocomplete="new-password" oninput="checkMatch()">
            <span id="match_msg" style="font-size:.78rem;display:none;margin-top:.25rem;"></span>
        </div>
        <div style="display:flex;gap:.8rem;">
            <button type="submit" class="btn btn-primary" id="submit_btn">🔑 Change Password</button>
            <a href="{{ url_for('dashboard') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>

<script>
function checkMatch() {
    const np = document.getElementById('new_pw').value;
    const cp = document.getElementById('confirm_pw').value;
    const msg = document.getElementById('match_msg');
    const btn = document.getElementById('submit_btn');
    if (cp === '') { msg.style.display='none'; return; }
    if (np === cp) {
        msg.textContent = '✅ Passwords match';
        msg.style.color = '#2d6a4f';
        msg.style.display = 'block';
        btn.disabled = false;
    } else {
        msg.textContent = '❌ Passwords do not match';
        msg.style.color = '#c0392b';
        msg.style.display = 'block';
        btn.disabled = true;
    }
}
</script>
{% endblock %}
