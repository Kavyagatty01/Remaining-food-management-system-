<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Login – FoodWise</title>
    <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'DM Sans', sans-serif;
            background: #2d6a4f;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #fff;
            border-radius: 18px;
            padding: 2.5rem 2rem;
            width: 100%;
            max-width: 380px;
            box-shadow: 0 8px 40px rgba(0,0,0,.2);
        }
        .logo {
            text-align: center;
            margin-bottom: 1.5rem;
        }
        .logo .icon { font-size: 2.5rem; }
        .logo h1 {
            font-family: 'DM Serif Display', serif;
            font-size: 1.8rem;
            color: #2d6a4f;
            margin-top: .3rem;
        }
        .logo p { color: #777; font-size: .9rem; margin-top: .2rem; }

        .flash {
            padding: .7rem 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-size: .88rem;
            font-weight: 500;
            background: #fde8e8;
            color: #7b1818;
            border-left: 4px solid #c0392b;
        }

        .form-group { margin-bottom: 1rem; }
        label { display: block; font-size: .82rem; font-weight: 600; color: #555; text-transform: uppercase; letter-spacing: .5px; margin-bottom: .35rem; }
        input {
            width: 100%;
            padding: .7rem 1rem;
            border: 1.5px solid #ddd;
            border-radius: 8px;
            font-size: .95rem;
            font-family: inherit;
            transition: border-color .2s;
        }
        input:focus { outline: none; border-color: #52b788; }

        button {
            width: 100%;
            padding: .8rem;
            background: #2d6a4f;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            font-family: inherit;
            cursor: pointer;
            margin-top: .5rem;
            transition: background .2s;
        }
        button:hover { background: #1b4332; }

        .hint {
            text-align: center;
            margin-top: 1rem;
            font-size: .82rem;
            color: #999;
        }
    </style>
</head>
<body>
<div class="login-box">
    <div class="logo">
        <div class="icon">🌿</div>
        <h1>FoodWise</h1>
        <p>Food Waste Management System</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
            <div class="flash">{{ message }}</div>
        {% endfor %}
    {% endwith %}

    <form method="POST">
        <div class="form-group">
            <label>Username</label>
            <input type="text" name="username" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" name="password" placeholder="Enter password" required>
        </div>
        <button type="submit">Login →</button>
    </form>

    <div style="text-align:center;margin-top:1.2rem;padding-top:1.2rem;border-top:1px solid #eee;">
        <a href="/public" style="color:#2d6a4f;font-size:.85rem;font-weight:600;text-decoration:none;">🌍 View Public Donation Page →</a>
    </div>
</div>
</body>
</html>
